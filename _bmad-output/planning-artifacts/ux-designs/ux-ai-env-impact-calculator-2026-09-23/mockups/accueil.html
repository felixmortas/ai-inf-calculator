<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Empreinte IA — accueil</title><style>
/* DESIGN.md — Canopée épurée. Tokens: surface-base #fff, surface-muted #F4F4F4, accent #0B7A5E, accent-brand #10A37F, accent-tint #E6F6F1. EXPERIENCE.md prime en cas d'écart. */
:root{--base:#fff;--muted:#f4f4f4;--ink:#0d0d0d;--ink2:#5f6b66;--accent:#0b7a5e;--brand:#10a37f;--tint:#e6f6f1;--outline:#8a8a8a;--focus:#184bb2;
--c-ink:#333;--c-s:#ecefed;--w-ink:#1f5fa8;--w-s:#e8f1fc;--p-ink:#8a5a00;--p-s:#fff3dc;
--card:0 4px 12px rgba(0,0,0,.05);--active:0 6px 20px rgba(0,0,0,.08);--bar:0 -4px 16px rgba(0,0,0,.06)}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.5 Inter,system-ui,-apple-system,"SF Pro Text",Roboto,sans-serif}
main{width:min(100%,760px);margin:0 auto;padding:16px 16px 120px}
h1{font-size:26px;line-height:1.2;font-weight:700;margin:4px 0 8px}
h2{font-size:18px;line-height:1.3;font-weight:600;margin:0 0 8px}
p{margin:0 0 12px}.sub{color:var(--ink2)}.label{font-size:14px;font-weight:600;line-height:1.35}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,a.btn{font:inherit;cursor:pointer;min-height:44px;border:0}
.back{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--ink);padding:0 8px 0 0;font-weight:500}
.step{font-size:14px;font-weight:600;color:var(--ink2);margin-top:8px}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border-radius:999px;padding:12px 28px;font-weight:600;box-shadow:var(--card)}
.primary.big{min-height:56px;padding:14px 40px;font-size:18px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--muted);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600}
a.link,.link{color:var(--accent);text-decoration:underline;font-weight:500;background:none;padding:10px 4px;display:inline-block}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card{background:var(--base);border-radius:16px;box-shadow:var(--card);padding:16px;margin:0 0 24px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px 4px 8px;font-size:14px;font-weight:600}
.badge svg.i{width:18px;height:18px}
.b-c{background:var(--c-s);color:var(--c-ink)}.b-w{background:var(--w-s);color:var(--w-ink)}.b-p{background:var(--p-s);color:var(--p-ink)}
.ok{color:var(--accent);font-weight:600}
.field{display:block;width:100%;border:1px solid var(--outline);border-radius:24px;padding:14px 18px;font:inherit;color:var(--ink);min-height:88px;resize:vertical;background:var(--muted)}
.field::placeholder{color:var(--ink2)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:var(--bar);padding:12px 16px;display:flex;justify-content:center}
.disc{display:grid;place-items:center;width:40px;height:40px;border-radius:50%}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="leaf" viewBox="0 0 24 24"><path d="M5 19c0-8 4-13 14-14 0 9-4 14-12 14"/><path d="M5 19c3-4 6-7 9-9"/></symbol>
<symbol id="drop" viewBox="0 0 24 24"><path d="M12 3c3.5 4.2 6 7.2 6 10.2A6 6 0 0 1 6 13.2C6 10.2 8.5 7.2 12 3z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2 2"/></symbol>
<symbol id="bolt" viewBox="0 0 24 24"><path d="M13.5 3.5L6 13.2h5l-1 7.3 7.5-9.7h-5z"/></symbol>
<symbol id="bulb" viewBox="0 0 24 24"><path d="M9 17.5h6M10 20.5h4M12 3.5a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3.5z"/><path d="M12 16v-4.5c1.2 0 2-.7 2.6-1.6"/></symbol>
<symbol id="shower" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 16 0z"/><path d="M12 4V2.5M8 15.5l-.8 2M12 15.5v2.5M16 15.5l.8 2M6.5 20.5l-.5 1M12 21l0 1M17.5 20.5l.5 1"/></symbol>
<symbol id="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.500 5.600 12 3z"/></symbol>
<symbol id="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
<symbol id="share" viewBox="0 0 24 24"><path d="M12 15V4M8 7.5L12 4l4 3.5M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="clip" viewBox="0 0 24 24"><path d="M19 11l-7.5 7.5a4.5 4.5 0 0 1-6.4-6.4L13 4.2a3 3 0 0 1 4.3 4.3L9.5 16.3a1.5 1.5 0 0 1-2.1-2.1l7-7"/></symbol>
</defs></svg>
<main style="min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-bottom:16px">
<h1 style="font-size:36px;line-height:1.1;max-width:14em">Calculateur d’impact de votre conversation avec une IA</h1>
<p class="sub" style="font-size:18px;max-width:26em;border-left:0;margin:8px 0 32px">Estimez l’énergie, le CO₂ et l’eau consommés par votre conversation avec une IA, comparés à une douche chaude.</p>
<button class="primary big" type="button">Commencer</button>
<a class="link" href="#" style="margin-top:12px">Méthodologie</a>
<button class="pill" type="button" style="margin-top:8px" aria-label="Langue : Français"><svg class="i" aria-hidden="true"><use href="#globe"/></svg>Langue : Français<svg class="i" aria-hidden="true" style="width:18px;height:18px"><use href="#chev"/></svg></button>
</main></body></html>
